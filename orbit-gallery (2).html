<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit Gallery — 3D Floating Thumbnails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#f4f1ea;
    --paper-dim:#c9c6bd;
    --line: rgba(244,241,234,0.08);
    --accent:#f4f1ea;
    --radius: 230px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--ink);
    color: var(--paper);
    font-family:'Archivo', sans-serif;
    overflow:hidden;
  }

  /* fine grid backdrop */
  .grid-bg{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events:none;
    mask-image: radial-gradient(circle at 50% 45%, black 10%, transparent 72%);
  }

  .label{
    position:fixed;
    top:32px; left:32px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--paper-dim);
    display:flex; flex-direction:column; gap:4px;
    z-index:5;
  }
  .label span:first-child{ color:var(--paper); }
  .label .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--paper); margin-right:6px;
    box-shadow: 0 0 8px var(--paper);
  }

  .hint{
    position:fixed;
    bottom:32px; left:32px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color: var(--paper-dim);
    z-index:5;
  }

  .counter{
    position:fixed;
    bottom:32px; right:32px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    color: var(--paper-dim);
    text-align:right;
    z-index:5;
  }

  /* ===== stage ===== */
  .stage-wrap{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    perspective: 1400px;
  }

  .stage{
    position:relative;
    width: 40px; height: 40px;
    transform-style: preserve-3d;
  }

  /* central core image */
  .core{
    position:absolute;
    top:50%; left:50%;
    width: 220px; height:220px;
    transform: translate(-50%,-50%) translateZ(0);
    transform-style: preserve-3d;
    z-index:2;
  }
  .core img, .core svg{
    width:100%; height:100%;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55)) drop-shadow(0 0 30px rgba(244,241,234,0.06));
  }

  /* orbit ring holding thumbnails, rotated continuously */
  .orbit{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    transform-style: preserve-3d;
  }

  .thumb-wrap{
    position:absolute;
    top:0; left:0;
    width: 96px; height: 54px;
    margin: -27px 0 0 -48px;
    transform-style: preserve-3d;
  }

  .thumb-bob{
    width:100%; height:100%;
    transform-style: preserve-3d;
  }

  .thumb-face{
    width:100%; height:100%;
    border-radius: 4px;
    overflow:hidden;
    cursor: pointer;
    border: 1px solid rgba(244,241,234,0.16);
    background: #111;
    position:relative;
    transform-style: preserve-3d;
    transition: border-color .25s ease;
  }
  .thumb-face:hover{ border-color: rgba(244,241,234,0.6); }
  .thumb-face:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }

  .thumb-face img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    filter: grayscale(0.5) contrast(1.05);
    transition: filter .3s ease, transform .4s ease;
  }
  .thumb-face:hover img{
    filter: grayscale(0) contrast(1.1);
    transform: scale(1.08);
  }

  .thumb-face::after{
    content: attr(data-idx);
    position:absolute; bottom:4px; left:6px;
    font-family:'Space Mono', monospace;
    font-size:9px;
    letter-spacing:.1em;
    color: var(--paper-dim);
    opacity:0;
    transition: opacity .25s ease;
  }
  .thumb-face:hover::after{ opacity:1; }

  /* ===== modal ===== */
  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(10,10,10,0.86);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    opacity:0;
    visibility:hidden;
  }

  .modal-frame{
    position:relative;
    max-width: min(80vw, 720px);
    max-height: 80vh;
  }
  .modal-frame img{
    display:block;
    max-width: 100%;
    max-height: 80vh;
    border: 1px solid rgba(244,241,234,0.14);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  .modal-meta{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    color: var(--paper-dim);
    text-transform:uppercase;
    margin-top:14px;
    display:flex;
    justify-content:space-between;
  }

  .modal-close{
    position:absolute;
    top:-40px; right:0;
    background:none; border:none;
    color: var(--paper);
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .modal-close:hover{ color: var(--paper-dim); }
  .modal-close .x{
    width:20px; height:20px;
    border:1px solid rgba(244,241,234,0.3);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-bg{ mask-image:none; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="label">
  <span><span class="dot"></span>ORBIT.01</span>
  <span>FLOATING ARRAY — LIVE</span>
</div>

<div class="hint">CLICK A FRAME TO EXPAND</div>
<div class="counter" id="counter">00 / 08</div>

<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">

    <!-- central core "image" — swap the <img> src for your own transparent PNG -->
    <div class="core" id="core">
    <img src="OIP.webp" alt="Core object">
        <defs>
          <radialGradient id="coreGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#d8d4c8"/>
            <stop offset="100%" stop-color="#4a4740"/>
          </radialGradient>
        </defs>
        <polygon points="110,8 205,60 205,160 110,212 15,160 15,60"
                 fill="url(#coreGrad)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
        <polygon points="110,8 205,60 110,110 15,60" fill="rgba(255,255,255,0.18)"/>
        <polygon points="110,110 205,60 205,160 110,212" fill="rgba(0,0,0,0.16)"/>
      </svg>
    </div>

    <!-- orbiting thumbnails injected by JS -->
    <div class="orbit" id="orbit"></div>

  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-frame">
    <button class="modal-close" id="modalClose"><span class="x">&times;</span> CLOSE</button>
    <img id="modalImg" src="" alt="Expanded view">
    <div class="modal-meta">
      <span id="modalLabel">FRAME 00</span>
      <span>ESC TO DISMISS</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){

  // ---- data: swap these URLs for your own thumbnails / full images ----
  const items = [
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1015/1200/800", label: "RIVER" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1025/1200/800", label: "FIELD" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1035/1200/800", label: "FOREST" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1043/1200/800", label: "COAST" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1050/1200/800", label: "STONE" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1060/1200/800", label: "DUSK" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1074/1200/800", label: "TRAIL" },
    { thumb: "https://tse4.mm.bing.net/th/id/OIP.mjvr9miL_x4Na6t_QJ04CQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", full: "https://picsum.photos/id/1084/1200/800", label: "RIDGE" }
  ];

  const orbit = document.getElementById('orbit');
  const stage = document.getElementById('stage');
  const stageWrap = document.getElementById('stageWrap');
  const core = document.getElementById('core');
  const counter = document.getElementById('counter');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RADIUS_XZ = 210;   // horizontal spread
  const RADIUS_Y = 190;    // vertical spread — pushes frames above & below the core
  const count = items.length;
  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // even sphere distribution
  counter.textContent = '00 / ' + String(count).padStart(2,'0');

  const wraps = [];

  items.forEach((item, i) => {
    // fibonacci-sphere placement so frames land above, below, and all around the core
    const t = count === 1 ? 0 : i / (count - 1);
    const yNorm = 1 - t * 2;              // 1 -> -1 (top to bottom)
    const ringR = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
    const theta = GOLDEN_ANGLE * i;

    const x = Math.cos(theta) * ringR * RADIUS_XZ;
    const z = Math.sin(theta) * ringR * RADIUS_XZ;
    const y = yNorm * RADIUS_Y;
    const angle = theta * 180 / Math.PI;

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

    const bob = document.createElement('div');
    bob.className = 'thumb-bob';

    const face = document.createElement('button');
    face.className = 'thumb-face';
    face.setAttribute('data-idx', String(i+1).padStart(2,'0'));
    face.setAttribute('aria-label', 'Open image ' + item.label);
    face.dataset.full = item.full;
    face.dataset.label = item.label;
    face.dataset.index = i;

    const img = document.createElement('img');
    img.src = item.thumb;
    img.alt = item.label + ' thumbnail';
    img.loading = 'lazy';

    face.appendChild(img);
    bob.appendChild(face);
    wrap.appendChild(bob);
    orbit.appendChild(wrap);

    wraps.push({ wrap, bob, face, angle });

    face.addEventListener('click', () => openModal(item, i));
  });

  // ---- continuous slow orbit rotation, with billboarding so thumbs face camera ----
  let orbitRotation = 0;
  if (!reduceMotion){
    gsap.to({}, {
      duration: 1/60,
      repeat: -1,
      onRepeat: tick
    });
  }

  const orbitTween = reduceMotion ? null : gsap.to(orbit, {
    rotationY: 360,
    duration: 90,
    repeat: -1,
    ease: 'none'
  });

  function tick(){
    orbitRotation = gsap.getProperty(orbit, 'rotationY');
    wraps.forEach(w => {
      // counter-rotate each thumb so it keeps facing the camera (billboard)
      gsap.set(w.bob, { rotationY: -orbitRotation });
    });
  }
  if (reduceMotion){
    // static, evenly facing outward-ish for reduced motion
    wraps.forEach(w => gsap.set(w.bob, { rotationY: 0 }));
  }

  // ---- per-thumbnail slow random float / drift ----
  wraps.forEach((w, i) => {
    if (reduceMotion) return;
    gsap.to(w.wrap, {
      y: '+=' + (12 + Math.random() * 16),
      duration: 3 + Math.random() * 2.5,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut',
      delay: Math.random() * 2
    });
    gsap.to(w.face, {
      rotationZ: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3),
      duration: 4 + Math.random() * 3,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut',
      delay: Math.random() * 2
    });
  });



  // ---- entrance ----
  gsap.from(core, { opacity: 0, scale: 0.7, duration: 1, ease: 'power3.out' });
  gsap.from(wraps.map(w => w.wrap), {
    opacity: 0,
    scale: 0.4,
    duration: 1.1,
    stagger: 0.08,
    ease: 'back.out(1.6)',
    delay: 0.2
  });

  // ---- mouse parallax tilt on stage ----
  if (!reduceMotion){
    let targetRX = 0, targetRY = 0;
    stageWrap.addEventListener('mousemove', (e) => {
      const rect = stageWrap.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      targetRY = px * 14;
      targetRX = -py * 14;
      gsap.to(stage, { rotationY: targetRY, rotationX: targetRX, duration: 1, ease: 'power2.out' });
    });
    stageWrap.addEventListener('mouseleave', () => {
      gsap.to(stage, { rotationY: 0, rotationX: 0, duration: 1.2, ease: 'power2.out' });
    });
  }

  // ---- modal ----
  const backdrop = document.getElementById('modalBackdrop');
  const modalImg = document.getElementById('modalImg');
  const modalLabel = document.getElementById('modalLabel');
  const modalClose = document.getElementById('modalClose');
  let lastFocused = null;

  function openModal(item, index){
    lastFocused = document.activeElement;
    modalImg.src = item.full;
    modalImg.alt = item.label;
    modalLabel.textContent = 'FRAME ' + String(index+1).padStart(2,'0');
    counter.textContent = String(index+1).padStart(2,'0') + ' / ' + String(count).padStart(2,'0');

    backdrop.style.visibility = 'visible';
    gsap.set(backdrop, { opacity: 0 });
    gsap.to(backdrop, { opacity: 1, duration: 0.35, ease: 'power2.out' });

    gsap.fromTo('.modal-frame',
      { opacity: 0, scale: 0.85, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'power3.out' }
    );

    modalClose.focus();
    document.addEventListener('keydown', onKeydown);
  }

  function closeModal(){
    gsap.to('.modal-frame', { opacity: 0, scale: 0.9, y: 10, duration: 0.3, ease: 'power2.in' });
    gsap.to(backdrop, {
      opacity: 0, duration: 0.3, ease: 'power2.in',
      onComplete: () => { backdrop.style.visibility = 'hidden'; }
    });
    document.removeEventListener('keydown', onKeydown);
    if (lastFocused) lastFocused.focus();
  }

  function onKeydown(e){
    if (e.key === 'Escape') closeModal();
  }

  modalClose.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeModal();
  });

})();
</script>
</body>
</html>
